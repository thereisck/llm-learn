spring.application.name=llm-learn
server.port=8900

# ========== OpenAI API\u914D\u7F6E ==========
openai.api.base-url=https://api.siliconflow.cn/v1
openai.api.model=Pro/zai-org/GLM-5.1
openai.api.key=${OPENAI_API_KEY:}

# ========== SQLite\u6570\u636E\u5E93\u914D\u7F6E\uFF08\u5D4C\u5165\u5F0F\uFF09 ==========
# \u6570\u636E\u6587\u4EF6\u5B58\u50A8\u4F4D\u7F6E\uFF1A\u9879\u76EE\u6839\u76EE\u5F55/data/llm_learn.db
spring.datasource.url=jdbc:sqlite:data/llm_learn.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

# JPA\u914D\u7F6E\uFF08SQLite\u65B9\u8A00\uFF09
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.properties.hibernate.format_sql=true

llm.base-url=https://api.siliconflow.cn/v1
llm.api-key=${LLM_API_KEY:}
llm.chat-model=Pro/zai-org/GLM-5.1
llm.embedding-model=Qwen/Qwen3-VL-Embedding-8B

rag.chunk-size=500
rag.overlap=100
rag.top-k=3
rag.threshold=0.6
