spring.application.name=llm-learn
server.port=8900

# Local-only secrets:
# 1) export SILICONFLOW_API_KEY=sk-xxx
# 2) or create ignored file: src/main/resources/application-local.properties
spring.config.import=optional:classpath:application-local.properties,optional:file:./application-local.properties

# ========== OpenAI-Compatible API \u914D\u7F6E ==========
openai.api.base-url=${OPENAI_API_BASE_URL:https://api.siliconflow.cn/v1}
openai.api.model=${OPENAI_API_MODEL:Pro/zai-org/GLM-5.1}
openai.api.key=${OPENAI_API_KEY:${SILICONFLOW_API_KEY:}}

# ========== SQLite \u6570\u636E\u5E93\u914D\u7F6E\uFF08\u5D4C\u5165\u5F0F\uFF09 ==========
# \u6570\u636E\u6587\u4EF6\u5B58\u50A8\u4F4D\u7F6E\uFF1A\u9879\u76EE\u6839\u76EE\u5F55/data/llm_learn.db
spring.datasource.url=jdbc:sqlite:data/llm_learn.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

# JPA \u914D\u7F6E\uFF08SQLite \u65B9\u8A00\uFF09
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.properties.hibernate.format_sql=true

llm.base-url=${LLM_BASE_URL:${OPENAI_API_BASE_URL:https://api.siliconflow.cn/v1}}
llm.api-key=${LLM_API_KEY:${SILICONFLOW_API_KEY:}}
llm.chat-model=${LLM_CHAT_MODEL:Pro/zai-org/GLM-5.1}
llm.embedding-model=${LLM_EMBEDDING_MODEL:Qwen/Qwen3-VL-Embedding-8B}
rag.rerank-model=BAAI/bge-reranker-v2-m3
# Rerank\u524D\u53EC\u56DE\u591A\u5C11\u5019\u9009
rag.rerank-top-k=20
# Rerank\u540E\u4FDD\u7559\u591A\u5C11
rag.rerank-top-n=3
rag.chunk-size=500
rag.overlap=100
rag.top-k=3
rag.threshold=0.6

# ========== 企业级RAG配置（Week4实验结论固化） ==========
enterprise.rag.chunk-strategy=semantic
enterprise.rag.semantic-strategy=THRESHOLD
enterprise.rag.semantic-param=0.5
enterprise.rag.search-mode=hybrid_rerank
enterprise.rag.threshold=0.5
enterprise.rag.top-k=5
enterprise.rag.rerank-candidate-k=20
enterprise.rag.rerank-top-n=5
enterprise.rag.enable-compression=true
enterprise.rag.compress-mode=summary
enterprise.rag.exact-match-boost=true
enterprise.rag.out-of-domain-detection=true
enterprise.rag.out-of-domain-threshold=0.4
enterprise.rag.out-of-domain-message=该问题不在当前知识库范围内，请咨询相关部门获取准确信息。
enterprise.rag.doc-dir=docs/enterprise
